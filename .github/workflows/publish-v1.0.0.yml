name: Publish v1.0.0

on:
  push:
    paths:
      - "release-trigger-v1.0.0.txt"

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.24.x"

      - name: Reconstruct build payload
        shell: bash
        run: |
          cat build/v1.0.0/part* > payload.b64
          base64 -d payload.b64 > payload.tar.xz
          tar -xJf payload.tar.xz
          test -f main.go
          test -f app64.ico

      - name: Embed Windows icon resource
        shell: bash
        run: |
          go install github.com/akavel/rsrc@latest
          "$(go env GOPATH)/bin/rsrc" -arch amd64 -ico app64.ico -o rsrc.syso

      - name: Build Windows x64
        shell: bash
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags='-s -w -H=windowsgui' -o OP_ED_calificados_de_ChobyMousepad_v1.0.0.exe main.go
          test -s OP_ED_calificados_de_ChobyMousepad_v1.0.0.exe

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create v1.0.0 \
            OP_ED_calificados_de_ChobyMousepad_v1.0.0.exe \
            --title "OP/ED calificados de ChobyMousepad v1.0.0" \
            --notes "Primera versión oficial. Basada en la rama funcional v1.10.2 e incluye el sistema de actualización automática para las próximas versiones."

      - name: Update stable manifest
        shell: bash
        run: |
          SHA="$(sha256sum OP_ED_calificados_de_ChobyMousepad_v1.0.0.exe | awk '{print $1}')"
          python3 - "$SHA" <<'PY'
          import json, sys
          sha = sys.argv[1]
          data = {
              "enabled": True,
              "channel": "stable",
              "version": "1.0.0",
              "mandatory": False,
              "download": "https://github.com/MaeseBrisa/chobymousepad-oped-releases/releases/download/v1.0.0/OP_ED_calificados_de_ChobyMousepad_v1.0.0.exe",
              "sha256": sha,
              "notes": "Primera versión oficial de OP/ED calificados de ChobyMousepad. Base funcional v1.10.2 y sistema de actualización automática preparado para futuras versiones."
          }
          with open("latest.json", "w", encoding="utf-8") as f:
              json.dump(data, f, ensure_ascii=False, indent=2)
              f.write("\n")
          PY
          git config user.name "chobymousepad-release-bot"
          git config user.email "actions@users.noreply.github.com"
          git add latest.json
          git commit -m "Publicar v1.0.0 en canal estable"
          git push
